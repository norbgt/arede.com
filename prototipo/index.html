<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F2F3EF">
<title>a rede.com · protótipo</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23141615'/%3E%3Ctext x='15' y='45' font-family='Helvetica Neue,Arial,sans-serif' font-weight='700' font-size='40' fill='%23fff'%3Ea%3C/text%3E%3Ccircle cx='47' cy='41' r='5' fill='%238D9BFF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   a rede · protótipo v2
   Princípio: MOBILE FIRST. Todo estilo base é para o celular (a partir de 320px).
   Telas maiores só ACRESCENTAM camadas, sempre com min-width:
     375px  rótulo do switch do algoritmo
     600px  respiros maiores
     768px  barra lateral, folhas viram diálogo, conteúdo aberto em 2 colunas
     1024px espaçamentos de desktop
   Layout: Início em blocos quadrados; Busca e páginas em mosaico de 2 colunas; largura máxima 640px (coluna de feed, como no Instagram).
   ===================================================================== */

/* ---------- 1. Tokens ---------- */
:root{
  --bg:#F2F3EF; --surface:#FFFFFF; --surface-2:#E7E9E4; --ink:#141615; --muted:#565C58; --line:#DADDD7;
  --accent:#2A3FD4; --on-accent:#FFFFFF;
  --ok:#1A7346; --warn:#8A5A00; --bad:#B42318; --warn-dot:#D99A0B;
  --scrim:rgba(10,12,11,.45);
  --shadow:0 1px 2px rgba(20,22,21,.06),0 6px 20px rgba(20,22,21,.06);
  --font-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --font-body:"Instrument Sans","Helvetica Neue",system-ui,sans-serif;
  --r-sm:12px; --r:16px; --r-lg:24px; --r-xl:32px;
  --gutter:12px; --gap:8px;
  --content:640px; --page:1100px;
  --nav-h:60px; --safe-b:env(safe-area-inset-bottom,0px); --nav-space:calc(var(--nav-h) + 10px);
  --fs-xs:11px; --fs-grid:13px; --fs-tile:clamp(12px,2.4cqw,15px); --fs-sm:13px; --fs-base:15px; --fs-card:clamp(15px,4.1vw,17px);
  --fs-h1:clamp(24px,6.4vw,30px); --fs-hero:clamp(26px,7vw,34px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1110; --surface:#191C1A; --surface-2:#252927; --ink:#ECEEEA; --muted:#A5ABA6; --line:#2E3330;
    --accent:#8D9BFF; --on-accent:#0F1110; --ok:#4ADE80; --warn:#FACC15; --bad:#F87171; --warn-dot:#FACC15;
    --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1110; --surface:#191C1A; --surface-2:#252927; --ink:#ECEEEA; --muted:#A5ABA6; --line:#2E3330;
  --accent:#8D9BFF; --on-accent:#0F1110; --ok:#4ADE80; --warn:#FACC15; --bad:#F87171; --warn-dot:#FACC15;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark;
}
@media (min-width:600px){ :root{ --gutter:16px; --gap:12px; } }
@media (max-width:599px){ .masonry,.masonry .col{gap:8px} .gridwrap{gap:8px} }
@media (min-width:768px){ :root{ --nav-h:0px; --nav-space:0px; } }
@media (min-width:1024px){ :root{ --gap:16px; --gutter:24px; } }

/* ---------- 2. Base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--fs-base);line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--font-display);margin:0;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:break-word;hyphens:auto}
p{margin:0}
b,strong{font-weight:600}
img,svg{max-width:100%}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon.sm{width:18px;height:18px}
.spacer{flex:1}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- 3. Estrutura (app shell) ---------- */
.container{width:100%;max-width:calc(var(--content) + 2*var(--gutter));margin:0 auto;padding:0 var(--gutter)}
.main{min-height:100vh;min-height:100dvh;padding-bottom:calc(var(--nav-space) + var(--safe-b) + 24px)}

/* barra de navegação: no celular, uma pílula flutuante só com ícones (referência Instagram);
   o item ativo ganha um fundo. A partir do tablet vira trilho lateral com rótulos. */
.nav{position:fixed;left:max(12px, env(safe-area-inset-left,0px));right:max(12px, env(safe-area-inset-right,0px));bottom:calc(10px + var(--safe-b));z-index:40;
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;height:var(--nav-h);padding:6px;max-width:440px;margin:0 auto;
  border-radius:999px;background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  box-shadow:0 6px 24px rgba(0,0,0,.18),inset 0 0 0 1px color-mix(in srgb,var(--line) 70%,transparent)}
.nav .brand{display:none;text-decoration:none;color:var(--ink);border-radius:12px}
.navbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;height:100%;min-height:44px;border:0;border-radius:999px;background:none;
  color:var(--muted);text-decoration:none;font-size:11px;font-weight:500;padding:0}
.navbtn .icon{width:24px;height:24px}
.navbtn .lbl{display:none}
.navbtn[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.navbtn[aria-current="page"] .icon{stroke-width:2.3}
.navbtn .bubble{display:grid;place-items:center}
/* trilho lateral a partir do tablet */
@media (min-width:768px){
  .nav{top:0;bottom:0;left:0;right:auto;width:96px;height:auto;max-width:none;margin:0;grid-template-columns:none;grid-auto-rows:min-content;align-content:start;gap:6px;
    padding:18px 8px;border-radius:0;background:var(--surface);box-shadow:none;border-right:1px solid var(--line);-webkit-backdrop-filter:none;backdrop-filter:none}
  .nav .brand{display:flex;justify-content:center;align-items:center;min-height:48px;font-size:30px;margin:0 0 10px}
  .navbtn{height:auto;min-height:60px;border-radius:16px}
  .navbtn .lbl{display:block}
  .navbtn .bubble{width:44px;height:32px;border-radius:12px;background:var(--ink);color:var(--bg)}
  .main{margin-left:96px}
}

/* cabeçalho */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid transparent;padding-top:env(safe-area-inset-top,0)}
.top.scrolled{border-bottom-color:var(--line)}
.topin{display:flex;flex-direction:column;gap:8px;padding-top:10px;padding-bottom:8px}
.toprow{display:flex;align-items:center;gap:8px;min-height:44px}
/* MARCA "a rede.com": "a rede" em peso forte; o ponto é um nó da rede, na cor de destaque;
   "com" mais leve. Lido em voz alta: "a rede com" — a rede com as pessoas.
   Símbolo compacto (trilho lateral e ícone do app): "a" + o mesmo nó. */
.logo{display:inline-flex;align-items:baseline;padding:10px 0;border:0;background:none;cursor:pointer;font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.035em;line-height:1;white-space:nowrap;color:var(--ink);text-decoration:none}
.logo .com{font-weight:500;letter-spacing:-.02em}
.ldot{display:inline-block;flex:none;width:.23em;height:.23em;margin:0 .05em 0 .07em;border-radius:50%;background:var(--accent)}
.logo .ext{display:inline-flex;align-items:baseline}
@media (max-width:429px){ .top .toprow{gap:4px} .logo{font-size:21px} }
@media (max-width:359px){ .logo{font-size:20px} .lchev{width:14px;height:14px;margin-left:2px} }
.lchev{align-self:center;width:14px;height:14px;margin-left:2px;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* com mouse: a marca aparece compacta ("a rede") e se completa ("a rede.com") ao passar o mouse */
@media (hover:hover) and (pointer:fine){
  .logo .ext{max-width:0;opacity:0;overflow:hidden;transition:max-width .28s ease,opacity .2s ease}
  .logo:hover .ext,.logo:focus-visible .ext{max-width:3.2em;opacity:1}
}
.mark{display:inline-flex;align-items:baseline;font-family:var(--font-display);font-weight:700;letter-spacing:-.04em;line-height:1;color:var(--ink)}
.mark .ldot{width:.24em;height:.24em;margin-left:.06em}
.pagehead{font-size:var(--fs-h1);font-weight:600}
@media (min-width:600px){ .logo{font-size:25px} .topin{padding-top:14px} }

/* ---------- 4. Componentes ---------- */
.iconbtn{width:44px;height:44px;flex:none;border-radius:14px;border:0;background:transparent;display:grid;place-items:center;position:relative;color:var(--ink)}
.iconbtn.solid{background:var(--surface);box-shadow:var(--shadow)}
.dot{position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;background:#E0592A;border:2px solid var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border:0;border-radius:var(--r-sm);
  background:var(--surface-2);font-weight:500;font-size:14px;text-decoration:none;color:var(--ink);text-align:center}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ink{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.block{width:100%}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.7;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row > .btn{flex:1 1 140px}
.linkbtn{border:0;background:none;padding:10px 2px;min-height:44px;color:var(--accent);font-weight:500;font-size:var(--fs-sm);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;flex:none;min-height:40px;padding:6px 14px;border:0;border-radius:999px;background:var(--surface-2);font-size:var(--fs-sm);font-weight:500;color:var(--ink)}
.chip.static{min-height:32px;padding:4px 12px}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*var(--gutter));padding:2px var(--gutter);scroll-snap-type:x proximity}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll > *{scroll-snap-align:start}
.chips.scroll,.tabs{scroll-padding-inline:var(--gutter)}
@media (min-width:768px){ .chips.scroll{flex-wrap:wrap;overflow:visible;margin:0;padding:0} }
.switch{position:relative;width:48px;height:28px;flex:none;border:0;border-radius:99px;background:var(--line);padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch::before{content:"";position:absolute;inset:-8px -4px}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.algosw{display:flex;align-items:center;gap:8px;min-height:44px;padding:6px;border:0;border-radius:14px;background:var(--surface-2);font-size:var(--fs-sm);font-weight:500;color:var(--ink)}
.algogroup{display:flex;align-items:center;border-radius:14px;background:var(--surface-2)}
.algogroup .algosw{background:transparent}
.algogroup .adj{width:40px;height:44px;border-radius:0 14px 14px 0;border-left:1px solid var(--line)}
.status .tool{width:40px;height:40px;flex:none}
.badge{position:absolute;top:4px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--accent);color:var(--on-accent);font-size:10.5px;font-weight:600;display:grid;place-items:center;line-height:1}
.badge.dot2{min-width:9px;width:9px;height:9px;padding:0;top:8px;right:8px}
.algosw .lbl{display:none}
.algosw .switch{pointer-events:none}
.algosw[aria-checked="false"] .lbl{color:var(--muted)}
@media (min-width:385px){ .algosw{padding-left:10px} .algosw .lbl{display:inline} }

/* abas de tipo de conteúdo: rolagem horizontal no celular */
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*var(--gutter));padding:0 var(--gutter);scroll-snap-type:x proximity;
  border-bottom:1px solid var(--line);-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;border:0;border-bottom:2.5px solid transparent;background:none;
  color:var(--muted);font-weight:500;font-size:14px;white-space:nowrap;scroll-snap-align:start}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
@media (min-width:768px){ .tabs{-webkit-mask-image:none;mask-image:none} }
.status{display:flex;align-items:center;gap:8px;min-height:36px;font-size:var(--fs-sm);color:var(--muted)}
.status .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status b{color:var(--ink);font-weight:500}

/* mosaico em 2 colunas (sempre) */
.masonry{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap);align-items:start}
.col{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
/* aba Vídeos: exclusivamente 1 coluna, largura confortável para assistir */
.masonry.one{grid-template-columns:minmax(0,1fr);max-width:520px;margin:0 auto;gap:calc(var(--gap)*2)}
.masonry.one .col{gap:calc(var(--gap)*2)}
.masonry.one .face.vid video{max-height:78vh;max-height:78dvh}

/* cartão em repouso: só o essencial */
.card{display:flex;flex-direction:column;gap:4px;min-width:0;animation:rise .3s ease both}
@keyframes rise{from{transform:translateY(6px)}to{transform:none}}
.facewrap{position:relative}
.face{position:relative;display:flex;flex-direction:column;gap:8px;width:100%;margin:0;padding:0;border:0;border-radius:var(--r);overflow:hidden;
  background:var(--surface);color:var(--ink);text-align:left;cursor:zoom-in}
.face.txt{padding:12px}
.face.k-votacao,.tface.k-votacao{box-shadow:inset 0 0 0 2px var(--ink)}
.face .art{display:block;width:100%;height:auto}
.fkind{font-size:var(--fs-xs);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.ftitle{font-family:var(--font-display);font-weight:600;font-size:var(--fs-card);line-height:1.18;overflow-wrap:break-word;hyphens:manual}
.bar{display:block;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.face.low > *:not(.mini):not(.thead){filter:blur(1px);opacity:.8}
.cap{display:flex;align-items:center;gap:6px;min-height:36px;padding:0 0 0 2px}
.cap.capimg{align-items:flex-start}
/* MESMA REGRA EM TODAS AS GRADES (premissa: contexto antes do clique)
   cartão textual: leitura de no mínimo 5 linhas (até 7 no mosaico)
   imagem: título em negrito + resumo, até 3 linhas · vídeo: até 2 linhas */
.fread{display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden;font-size:var(--fs-grid);line-height:1.4;min-height:7em;color:var(--muted)}
/* legenda de imagem e vídeo: o título tem linha própria (até 2), o resumo começa na linha seguinte;
   o total nunca passa de 3 linhas (imagem) ou 2 (vídeo) — fitTiles distribui as linhas */
.capx{display:flex;flex-direction:column;min-width:0;line-height:1.38}
.capx .ct{font-weight:600;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.capx.v .ct{-webkit-line-clamp:1}
.capx .cs{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--sl,1);overflow:hidden}
.capp{flex:1;padding-top:4px;font-size:var(--fs-grid);color:var(--muted)}
.capp .ct{color:var(--ink)}
.capav{flex:none;width:20px;height:20px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:8.5px;font-weight:600}
.capname{flex:1;min-width:0;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more{flex:none;width:40px;height:36px;margin-right:-8px;border:0;border-radius:10px;background:transparent;display:grid;place-items:center;color:var(--ink)}
.savebtn{display:none}
/* camadas de hover só para quem tem mouse */
@media (hover:hover) and (pointer:fine){
  .ov{position:absolute;inset:0;border-radius:var(--r);background:rgba(10,12,11,.3);opacity:0;pointer-events:none;transition:opacity .15s}
  .facewrap:hover .face.img ~ .ov,.facewrap:focus-within .face.img ~ .ov{opacity:1}
  .facewrap:hover .face.txt{box-shadow:inset 0 0 0 2px var(--line)}
  .facewrap:hover .face.k-votacao{box-shadow:inset 0 0 0 2px var(--ink)}
  .savebtn{display:grid;place-items:center;position:absolute;top:8px;right:8px;width:40px;height:40px;padding:0;border:0;border-radius:50%;background:color-mix(in srgb,var(--surface) 92%,transparent);color:var(--ink);box-shadow:var(--shadow);opacity:0;transition:opacity .15s}
  .savebtn .icon{width:19px;height:19px}
  .savebtn[aria-pressed="true"]{opacity:1;color:var(--accent)}
  .facewrap:hover .savebtn,.facewrap:focus-within .savebtn{opacity:1}
  .more:hover,.iconbtn:hover{background:var(--surface-2)}
  .lk:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
}
@media (min-width:600px){ .face.txt{padding:14px 16px} }

/* vídeo: assiste no próprio cartão (controles sempre visíveis, pensados para o toque) */
.face.vid video{display:block;width:100%;aspect-ratio:var(--ar);object-fit:cover;background:#000}
.vbadge{position:absolute;top:8px;left:8px;display:inline-flex;align-items:center;gap:3px;height:26px;padding:0 9px 0 6px;border:0;border-radius:99px;background:rgba(0,0,0,.55);color:#fff;font-size:11.5px;font-weight:500;font-variant-numeric:tabular-nums}
.vbadge .icon{width:14px;height:14px}
.vbtn{position:absolute;right:8px;bottom:10px;width:30px;height:30px;border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.vbtn .icon{width:16px;height:16px}
.vbadge::before,.vbtn::before{content:"";position:absolute;inset:-9px}
.vprog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.25);pointer-events:none;overflow:hidden;border-radius:0 0 var(--r) var(--r)}
.vprog i{display:block;height:100%;width:0;background:#fff}
.pinvid{display:block;width:100%;aspect-ratio:var(--ar);max-height:60vh;max-height:60dvh;background:#000;object-fit:contain}
@media (min-width:768px){ .pin.two .pinvid{max-height:520px} }

/* selo de confiabilidade: um único sinal, em tons contínuos */
.mini{position:absolute;left:8px;bottom:8px;display:inline-flex;align-items:center;gap:4px;padding:3px 7px 3px 3px;border-radius:99px;
  background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.sealico{display:inline-block;flex:none;vertical-align:middle}
.sealbox{border-radius:var(--r-sm);background:var(--surface-2);padding:6px 12px}
.sealbox summary{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;list-style:none}
.sealbox summary .linkbtn{min-height:0;padding:4px 0;font-size:12.5px}
.sealbox summary::-webkit-details-marker{display:none}
.sealbox .t{flex:1;min-width:0;display:flex;flex-direction:column}
.sealbox .t b{font-size:13.5px;line-height:1.3}
.sealbox .t small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.scale{position:relative;height:8px;margin:10px 0 4px;border-radius:99px;background:linear-gradient(90deg,#C0362C 0%,#C27A0E 45%,#6E9A3A 70%,#2E8B57 85%,#0F6B3E 100%)}
.scale i{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.scalelbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.checks{display:flex;flex-direction:column;margin-top:10px;padding:2px 12px;border-radius:var(--r-sm);background:var(--surface)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.chk:last-child{border-bottom:0}
.chk .st{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.chk .st.ok{background:var(--ok)} .chk .st.warn{background:var(--warn-dot);color:#141615} .chk .st.bad{background:var(--bad)} .chk .st.na{background:var(--line);color:var(--muted)}
.chk small{display:block;font-size:12.5px;color:var(--muted)}

/* blocos genéricos */
.note{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r);background:var(--surface-2);font-size:var(--fs-sm);color:var(--muted)}
.note .icon{width:18px;height:18px;margin-top:1px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.sectitle{font-size:19px;font-weight:600;margin:24px 0 12px}
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:768px){ .list.two{grid-template-columns:repeat(2,minmax(0,1fr))} }
.rowitem{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px;border:0;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);text-align:left;color:var(--ink)}
.rowitem .av{width:44px;height:44px;border-radius:14px;font-size:14px}
.rowitem .t{flex:1;min-width:0;display:flex;flex-direction:column}
.rowitem b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowitem small{font-size:13px;color:var(--muted)}
.av{flex:none;display:grid;place-items:center;color:#fff;font-weight:600;letter-spacing:.02em}
.setting{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.setting.stack{flex-direction:column;align-items:stretch}
.setting .t{flex:1;min-width:0}
.setting b{display:block;font-size:14.5px}
.setting small{display:block;font-size:13px;color:var(--muted)}
button.setting{width:100%;border:0;text-align:left;color:var(--ink)}
.stop{display:flex;flex-direction:column;gap:12px;margin:var(--gap) 0 24px;padding:20px;border-radius:var(--r-lg);background:var(--ink);color:var(--bg)}
.stop h3{font-size:22px}
.stop p{font-size:14px;opacity:.85}
.stop .btn{background:var(--bg);color:var(--ink)}
.stop .btn.ghost{background:transparent;color:var(--bg);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--bg) 40%,transparent)}
.loading{padding:20px;text-align:center;color:var(--muted);font-size:var(--fs-sm)}
.endnote{display:flex;flex-direction:column;align-items:center;gap:2px;max-width:420px;margin:0 auto;padding:28px 16px 36px;text-align:center;font-size:13.5px;color:var(--muted)}
.endnote::before{content:"";width:32px;height:2px;margin-bottom:12px;border-radius:2px;background:var(--line)}
.endnote b{font-weight:500;color:var(--ink)}
.endnote .acts{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.endnote .acts:empty{display:none}
.linkbtn.muted{color:var(--muted)}
.sentinel{height:1px}
.ver{margin:28px 0 8px;text-align:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* busca */
.search{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 14px;border-radius:var(--r);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line)}
.search:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px;padding:12px 0}
.search{min-width:0}
.search input{width:100%}
.search.pill{border-radius:999px;background:var(--surface-2);box-shadow:none;min-height:46px}
.search.pill:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.orgstrip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:12px calc(-1*var(--gutter)) 0;padding:0 var(--gutter)}
.orgstrip::-webkit-scrollbar{display:none}
.orgstrip .rowitem{flex:none;width:260px}

/* GRADE DO INÍCIO (referência Instagram): blocos quadrados de 3 colunas × 2 linhas.
   Cada cartão tem o seu tamanho, definido pelo tipo de conteúdo:
     imagem   1×1, quadrado ............ legenda de até 3 linhas
     vídeo    1×2, vertical ............ legenda de até 2 linhas
     textual  2×2, ou 1½×2 em dupla .... no mínimo 5 linhas de leitura
   Legenda = título em negrito + resumo, num só parágrafo (premissa: contexto antes do clique).
   O cartão aberto entra entre um bloco e o seguinte, na largura toda. */
.rwrap{container-type:inline-size;margin:10px calc(-1*var(--gutter)) 0}
.rgrid{display:flex;flex-direction:column;gap:2px}
.blk{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:2px;aspect-ratio:3/2}
/* com mais largura, as linhas ficam um pouco mais baixas que as colunas: menos vazio nos cartões de texto */
@container (min-width:560px){ .blk{aspect-ratio:3/1.6} .blk.row1{aspect-ratio:3/.8} }
.blk.row1{grid-template-rows:minmax(0,1fr);aspect-ratio:3/1}
.tile{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--surface-2)}
.tbtn{position:absolute;inset:0;display:block;width:100%;height:100%;padding:0;border:0;background:none;cursor:zoom-in;color:#fff;text-align:left}
.tbtn .art,.tbtn video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
/* legenda de imagem (3 linhas) e vídeo (2 linhas) */
.tcap{position:absolute;left:0;right:0;bottom:0;padding:22px 9px 8px;background:linear-gradient(transparent,rgba(0,0,0,.68));color:#fff}
.tcap .capx{font-size:var(--fs-tile)}
/* cartão textual: tipo e selo no topo, título, leitura que ocupa o espaço (mín. 5 linhas), dados no pé */
.tface{position:absolute;inset:0;display:flex;flex-direction:column;gap:6px;padding:10px 12px 12px;color:var(--ink);overflow:hidden}
.thead{display:flex;align-items:center;gap:6px;min-width:0;flex:none}
.thead .fkind{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tface .ftitle{flex:none;hyphens:manual;font-size:clamp(14px,3.4cqw,21px);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.tile.h .tface .ftitle{font-size:clamp(14px,3cqw,19px)}
/* celular estreito: o pé mostra só o dado principal de cada tipo, para a leitura manter 5 linhas */
@container (max-width:420px){ .tface .ftitle{-webkit-line-clamp:2} .tface,.tmain{gap:5px} .tface{padding:9px 10px 10px} .tfoot .t2{display:none} .tface .evd{width:38px;padding:4px 0 5px} .tface .evd b{font-size:17px} .tface .cstat{font-size:12px} .tface .cstat b{font-size:1.2em} .tface .thead{min-height:0} .tile .vbadge.t .vt{display:none} .tile .vbadge.t{width:26px;padding:0;justify-content:center} }
/* o miolo se centraliza na altura quando o texto é curto: o cartão nunca fica com um vazio embaixo */
/* título e leitura no topo; os dados do tipo (votos, quórum, data, meta) sempre no pé */
.tmain{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:6px}
.tbody{flex:0 1 auto;min-height:0;overflow:hidden}
.tbody p{font-size:var(--fs-tile);line-height:1.42;color:var(--muted);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--cl,5);overflow:hidden}
.tfoot{flex:none;display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-top:4px}
.tmeta{font-size:clamp(11px,2.2cqw,13px);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tfoot .bar{height:4px}
/* selo: sobre a imagem, no canto; no cartão textual, ao lado do tipo */
.tseal{position:absolute;top:6px;left:6px;display:inline-flex;align-items:center;gap:3px;padding:2px 6px 2px 2px;border-radius:99px;background:rgba(0,0,0,.45);font-size:10.5px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums;pointer-events:none}
.thead .tseal{position:static;flex:none;background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink)}
/* vídeo: assiste no próprio cartão */
.tctl{position:absolute;top:5px;right:5px;display:flex;gap:4px;align-items:center}
.vbtn2{position:relative;width:26px;height:26px;border:0;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center}
.vbtn2 .icon{width:15px;height:15px}
.vbadge.t{position:relative;top:auto;left:auto;height:26px}
.vbtn2::before,.vbadge.t::before{content:"";position:absolute;inset:-8px -3px}
.tile .vprog{border-radius:0}
.tile.s .vbadge.t .vt{display:none}
.tile.s .vbadge.t{width:26px;padding:0;justify-content:center}
.tile.low .tbtn > :not(.tface),.tile.low .tmain{filter:blur(1px);opacity:.8}
.tile .savebtn{top:8px;right:8px}
.tile.vid .savebtn{display:none}
.rgrid > .xcard{margin:6px var(--gutter)}

/* ---------- CADA TIPO COM SEU SINAL (Início, Buscar e abas) ----------
   evento: folhinha de calendário (dia da semana, dia, mês) · enquete: quem lidera
   votação formal: moldura escura + barra com a marca do quórum · chamado: "Faltam N" na cor da organização
   documento: folha de papel com canto dobrado */
.evrow{display:flex;align-items:center;gap:10px;min-width:0;flex:none}
.evrow .ftitle{flex:1;min-width:0}
.evd{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:44px;padding:5px 0 6px;border-radius:10px;background:var(--surface);
  box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink);line-height:1;text-align:center}
.evd b{font-family:var(--font-display);font-size:20px;font-weight:600;margin:2px 0 1px}
.evd small{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.evd small:first-child{color:var(--bad)}
.evd.big{width:60px;padding:8px 0 9px;border-radius:14px}
.evd.big b{font-size:28px}
.evd.big small{font-size:10.5px}
.qbar{position:relative;display:block;flex:none;height:6px;border-radius:99px;background:color-mix(in srgb,var(--ink) 12%,transparent)}
.qbar i{display:block;height:100%;border-radius:99px;background:var(--ink)}
.qbar em{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:2px;background:var(--accent);transform:translateX(-1px)}
.popts{display:flex;flex-direction:column;gap:4px}
.popt{position:relative;display:flex;justify-content:space-between;gap:8px;padding:4px 8px;border-radius:7px;overflow:hidden;background:color-mix(in srgb,var(--ink) 6%,transparent);font-size:12.5px;line-height:1.3;color:var(--muted)}
.popt i{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--accent) 16%,transparent)}
.popt span{position:relative;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.popt .pp{flex:none;font-variant-numeric:tabular-nums}
.popt.lead{color:var(--ink);font-weight:600}
.cstat{font-size:13px;line-height:1.2}
.cstat b{font-family:var(--font-display);font-size:1.45em;font-weight:600}
.dstat{display:inline-flex;align-self:flex-start;align-items:center;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--warn-dot) 22%,transparent);color:var(--ink);font-size:11.5px;font-weight:500;white-space:nowrap}
.face.k-documento,.tface.k-documento{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line)}
.face.k-documento::after,.tface.k-documento::after{content:"";position:absolute;top:0;right:0;width:22px;height:22px;background:linear-gradient(225deg,var(--bg) 50%,var(--surface-2) 50%);border-bottom-left-radius:6px}
.face.k-votacao,.tface.k-votacao{background:var(--surface)}
.ffoot{display:flex;flex-direction:column;gap:6px}
.ffoot .tmeta{font-size:12.5px}
.tmeta b{font-weight:600;color:var(--ink)}

/* ---------- ABAS DE TIPO: leiaute próprio ----------
   Eventos e chamados = agenda (à esquerda, a data do evento ou quanto falta no chamado) · Votações = cédula (vota no cartão) · Documentos = arquivo */
.lwrap{margin-top:10px}
.gridwrap.one.v-agenda,.gridwrap.one.v-cedula,.gridwrap.one.v-arquivo{max-width:none}
.masonry.one.v-agenda,.masonry.one.v-cedula,.masonry.one.v-arquivo{max-width:none;gap:10px}
.masonry.one.v-agenda .col,.masonry.one.v-cedula .col,.masonry.one.v-arquivo .col{gap:10px}
.lcard{display:flex;flex-direction:column;min-width:0;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);overflow:hidden;animation:rise .3s ease both}
.lmain{display:flex;gap:12px;align-items:flex-start;width:100%;padding:14px;border:0;background:none;text-align:left;color:var(--ink);cursor:zoom-in}
.lmain.col{flex-direction:column;align-items:stretch;gap:8px}
.lbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ltitle{font-family:var(--font-display);font-weight:600;font-size:clamp(16px,4.4vw,19px);line-height:1.2;overflow-wrap:break-word}
.lsum{font-size:13.5px;line-height:1.42;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.lmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lmeta .icon{width:15px;height:15px}
.lwhen{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lstat{margin-left:auto;font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
.lfoot{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px 10px}
.lwho{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.lcount{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.btn.sm{min-height:40px;padding:8px 16px}
.lact{display:flex;flex-direction:column;gap:8px;padding:0 14px 6px}
.lopts{display:flex;flex-direction:column;gap:6px}
.lopts .opt{min-height:44px}
.lopts .pc{position:relative;font-variant-numeric:tabular-nums}
.lnote{font-size:12.5px;color:var(--muted)}
.lnote b{color:var(--ink);font-weight:600}
.lcard.formal{box-shadow:inset 0 0 0 2px var(--ink),var(--shadow)}
.lcard.low .ltitle,.lcard.low .lsum{filter:blur(1px);opacity:.8}
.lcard.ag .lmain{padding-bottom:8px}
.lcard.ag .lsum{-webkit-line-clamp:2}
.cnum{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:60px;padding:8px 0 9px;border-radius:14px;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);line-height:1;text-align:center}
.cnum b{font-family:var(--font-display);font-size:26px;font-weight:600}
.cnum small{margin-top:3px;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.lcard.ch .bar{height:5px}
.lfoot .btn.sm .icon{width:16px;height:16px}

.docsheet{position:relative;flex:none;display:flex;flex-direction:column;gap:5px;width:58px;height:74px;padding:9px 8px;border-radius:6px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line)}
.docsheet::after{content:"";position:absolute;top:0;right:0;width:14px;height:14px;background:linear-gradient(225deg,var(--bg) 50%,var(--surface-2) 50%);border-bottom-left-radius:4px}
.docsheet small{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;max-width:40px}
.docsheet i{display:block;height:3px;border-radius:2px;background:var(--line)}
.lcard.ar .lsum{-webkit-line-clamp:2}
@media (min-width:600px){ .lmain{padding:16px 18px} .lact{padding:0 18px 6px} .lfoot{padding:0 18px 12px} .docsheet{width:66px;height:84px} }
@media (hover:hover) and (pointer:fine){ .lmain:hover .ltitle{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px} }
@media (min-width:768px){ .rwrap{margin:12px 0 0} .rgrid,.blk{gap:4px} .tile{border-radius:6px} .rgrid > .xcard{margin:8px 0} }

/* página da organização */
.orghero{position:relative;height:120px;overflow:hidden}
.orghero > svg{display:block;width:100%;height:100%}
.orghero .iconbtn{position:absolute;top:calc(8px + env(safe-area-inset-top,0));left:8px}
.orghead{display:flex;flex-direction:column;gap:10px;margin-top:-30px;position:relative}
.orghead .av{width:64px;height:64px;border-radius:20px;font-size:20px;border:4px solid var(--bg)}
.orghead h1{font-size:var(--fs-h1);font-weight:600}
@media (min-width:768px){ .orghero{height:180px} }

/* perfil */
.prof{display:flex;align-items:center;gap:14px;margin-top:8px}
.prof .av{width:60px;height:60px;border-radius:20px;font-size:19px;background:var(--ink);color:var(--bg)}
/* pastas: miniaturas pequenas (3 por linha no celular, até 5 no desktop) */
.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,112px));gap:12px 10px}
.board{min-width:0;padding:0;border:0;background:none;text-align:left;color:var(--ink)}
.bmini{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:2px;aspect-ratio:1/1;border-radius:var(--r-sm);overflow:hidden}
.bmini svg{display:block;width:100%;height:100%}
.bmini svg:first-child{grid-row:span 2}
.folderpick .bmini{flex:none;width:48px;border-radius:10px}
/* perfil: conteúdo (topo + abas) separado das configurações (engrenagem) */
.phead{gap:10px;min-height:56px}
.pav{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:14px}
.pwho{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.pwho b{font-family:var(--font-display);font-size:19px;font-weight:600}
.plink{font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:2px;padding:2px 0}
.tabs.center{justify-content:center;border-bottom:0;-webkit-mask-image:none;mask-image:none}
.phint{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:10px 0 14px;font-size:12.5px;color:var(--muted)}
.phint .icon{width:14px;height:14px;vertical-align:-2px}
.status .txt .icon{width:14px;height:14px;vertical-align:-2px}
.pboards{margin-top:12px}
/* aba Algoritmo do perfil: transparência com gráficos simples (rótulo + barra + número) */
.apanel{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.acard{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.acard h3{font-family:var(--font-body);font-size:15px;font-weight:600}
.acard .anote{font-size:12.5px;color:var(--muted);margin-top:-4px}
.abars{display:flex;flex-direction:column;gap:8px}
/* celular: rótulo e número na linha de cima, barra embaixo; com espaço, tudo numa linha */
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 10px;font-size:13px}
.arow .ab{grid-column:1 / -1;grid-row:2}
@media (min-width:600px){ .arow{grid-template-columns:11.5em minmax(0,1fr) 4.5em} .arow .ab{grid-column:auto;grid-row:auto} }
.arow .al{display:flex;align-items:center;gap:5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.arow .ab{display:block;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.arow .ab i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.arow .av2{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.amix{display:flex;gap:2px;height:10px;border-radius:99px;overflow:hidden;background:var(--surface)}
.amix i{display:block;background:var(--ink);border-radius:99px 0 0 99px}
.amix b{display:block;background:var(--accent);border-radius:0 99px 99px 0}
.alegend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.alegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.alegend .k1{background:var(--ink)} .alegend .k2{background:var(--accent)}

.pubtabs{margin-top:16px}
.pints{margin:2px 0 6px;align-items:center}
.pints .linkbtn{min-height:28px;padding:2px 4px;font-size:12.5px}
.intcount{font-size:13px;color:var(--muted)}
.intcount b{color:var(--ink);font-weight:600}
.chip:disabled{opacity:.4;cursor:not-allowed}

#pbody .rwrap{margin-top:0}
.bempty{grid-column:1 / -1;grid-row:1 / -1;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
a.setting{color:var(--ink);text-decoration:none}
.board b .icon,.folderpick b .icon{width:13px;height:13px;vertical-align:-1px;color:var(--muted)}
.pubhead{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 0 4px;text-align:center}
.pubhead .av{width:76px;height:76px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:22px}
.pubhead h2{font-size:24px}
.pubhead p{font-size:13.5px;color:var(--muted)}
/* ao vivo, denúncia, mandatos, rodapé e manifesto */
.live{display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:#E0245E;vertical-align:1px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.reptag{flex:none;margin-left:auto;padding:1px 7px;border-radius:99px;background:color-mix(in srgb,var(--warn-dot) 24%,transparent);color:var(--ink);font-size:10.5px;font-weight:600;white-space:nowrap}
.linkbtn.rep{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:6px 0;font-size:12.5px}
.linkbtn.rep .icon{width:14px;height:14px}
.repbox{display:flex;gap:8px;align-items:flex-start;margin-top:8px;padding:8px 10px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--warn-dot) 16%,transparent);font-size:12.5px;line-height:1.4;color:var(--ink)}
.repbox.ok{background:color-mix(in srgb,var(--ok) 12%,transparent)}
.repbox .icon{width:15px;height:15px;margin-top:1px;flex:none}
.repbox .linkbtn{min-height:0;padding:0;font-size:12.5px}
.warnnote{background:color-mix(in srgb,var(--warn-dot) 16%,var(--surface-2));color:var(--ink)}
.sfoot{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 10px;margin:36px 0 8px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.sfoot a{color:var(--ink);text-decoration:none;padding:8px 2px}
.sfoot a:hover{text-decoration:underline}
.sfoot .sv{flex-basis:100%;text-align:center;font-variant-numeric:tabular-nums}
.navfoot{display:none}
@media (min-width:768px){ .navfoot{display:block;position:absolute;left:0;right:0;bottom:14px;padding:12px 4px;font-size:11.5px;color:var(--muted);text-align:center;text-decoration:none} }
.mani{max-width:62ch;margin:8px auto 0;font-size:16px;line-height:1.6}
.mani h2{font-size:22px;margin:32px 0 10px}
.mani h3{font-size:17px;margin:22px 0 8px}
.mani p{margin:0 0 14px}
.mani ul{margin:0 0 14px;padding-left:20px}
.mani s{opacity:.6}
.mani .mlead{color:var(--muted);font-size:14px}
.rules{display:flex;flex-direction:column;gap:12px;margin:28px 0 0}
.rules > div{padding:14px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.rules dt{font-weight:600;font-size:15px}
.rules dt small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.rules dd{margin:4px 0 0;font-size:14px;line-height:1.5;color:var(--muted)}

.pacts{display:flex;align-items:center;margin-right:-8px}
.plink{white-space:nowrap}



.board b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:5px;font-size:13px;line-height:1.25}
.board small{font-size:12px;color:var(--muted)}

/* página do conteúdo (pin) — celular: tela cheia, uma coluna */
.pinpage{padding:0 0 8px}
.pin{display:flex;flex-direction:column;background:var(--surface)}
.pl,.pr{min-width:0}
.pinvis{position:relative;background:var(--surface-2)}
.pinvis .art{display:block;width:100%;height:auto;aspect-ratio:4/3;max-height:52vh;max-height:52dvh}
.floatback{position:absolute;top:calc(10px + env(safe-area-inset-top,0));left:10px}
.pinmain{display:flex;flex-direction:column;gap:16px;min-width:0;padding:8px var(--gutter) 20px}
.pinside{display:flex;flex-direction:column;gap:12px;min-width:0;padding:0 var(--gutter) 24px}
.pinside:empty{display:none}
.pinbar{display:flex;align-items:center;gap:2px;min-height:52px}
.pinbar [data-act="save"][aria-pressed="true"]{color:var(--accent)}
.actbtn{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:44px;height:44px;padding:0 8px;border:0;border-radius:14px;background:none;color:var(--ink);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.actbtn.on{color:#E0245E}
.actbtn.on .cnt{color:var(--ink)}
.pin.two .barback{display:none}
.orgline{display:flex;align-items:center;gap:10px}
.orgline .av{width:40px;height:40px;border-radius:13px;font-size:13px}
.orgline .t{flex:1;min-width:0;display:flex;flex-direction:column}
.orgline .who{padding:10px 0;margin:-10px 0;border:0;background:none;text-align:left;font-weight:600;font-size:14.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orgline small{font-size:12.5px;color:var(--muted)}
.orgline .btn{flex:none;min-height:40px;padding:8px 14px}
.native{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r-sm);background:var(--surface-2);font-size:var(--fs-sm);color:var(--muted)}
.pintitle{font-size:var(--fs-hero);font-weight:600;line-height:1.08;margin:6px 0 12px}
.pintext{position:relative;max-height:17em;overflow:hidden}
.moretext{align-self:flex-start}
.pintext.open{max-height:none!important}
.pintext.clamped:not(.open)::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3em;background:linear-gradient(transparent,var(--surface))}
.pinbody{font-size:16px;line-height:1.55;margin:0 0 10px;max-width:65ch}
.pinsec{border-top:1px solid var(--line);padding-top:14px}
.pinsec.s{padding-top:12px}
.pinh{font-family:var(--font-body);font-size:13px;font-weight:600;margin:0 0 8px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{position:relative;display:flex;justify-content:space-between;gap:8px;width:100%;min-height:48px;padding:12px;border:0;border-radius:var(--r-sm);
  box-shadow:inset 0 0 0 1.5px var(--line);background:var(--surface);text-align:left;font-size:14px;font-weight:500;overflow:hidden;color:var(--ink)}
.opt .fill{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--accent) 16%,transparent)}
.opt span{position:relative}
.opt.mine{box-shadow:inset 0 0 0 2px var(--accent)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.fact{padding:8px 10px;border-radius:10px;background:var(--surface-2);font-size:12px;color:var(--muted)}
.fact b{display:block;font-size:13.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.lks{display:flex;flex-direction:column;gap:8px}
.lk .t{flex:1;min-width:0;display:flex;flex-direction:column}
/* informações complementares do cartão aberto: compactas, em segundo plano */
.lks{gap:6px}
.lk{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:7px 10px 7px 8px;border:0;border-radius:var(--r-sm);box-shadow:inset 0 0 0 1px var(--line);background:var(--surface);text-align:left;color:var(--ink)}
.lk b{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk .t > span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk > .icon{width:16px;height:16px;color:var(--muted)}
.lkic{flex:none;width:34px;height:34px;border-radius:9px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center}
.lkic .icon{width:17px;height:17px}
.lkic .art{width:100%;height:100%}
.chips.tags{gap:6px;margin:10px 0 6px}
.chips.tags .chip{min-height:28px;padding:3px 10px;font-size:12.5px;gap:4px}
.chips.tags .chip .icon{width:14px;height:14px}
.flip{transform:rotate(180deg)}
.why{display:flex;gap:6px;align-items:flex-start;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted)}
.why .icon{width:14px;height:14px;margin-top:1px}
.why.out{color:#B8430F}
:root[data-theme="dark"] .why.out{color:#FB8F4E}
.related{margin-top:28px}
.related h2{text-align:center;margin:0 0 14px;font-size:19px}
/* DUAS COLUNAS EQUILIBRADAS: ativadas por JS quando o próprio cartão tem 640px ou mais.
   Imagem na coluna da esquerda, leitura na da direita; as seções (vinculados, informações)
   vão sempre para a coluna mais curta, para nenhum cartão abrir com espaço vazio. */
.pin.cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}
.pin.cols .pl{display:flex;flex-direction:column;gap:18px;padding:16px 0 20px 16px}
.pin.cols .pinvis{border-radius:var(--r);overflow:hidden}
.pin.cols .pinvis .art{aspect-ratio:4/5;max-height:480px}
.pin.cols .pinvid{max-height:480px}
.pin.cols .pr{display:flex;flex-direction:column;gap:18px;padding-bottom:20px}
.pin.cols .pinmain{padding:12px 20px 0}
.pin.cols .pr > .pinsec{margin:0 20px}
.pin.cols .pinside{display:none}
.pin.cols .floatback{display:none}
.pin.two:not(.cols) .barback{display:none}
@media (min-width:768px){
  .pinpage{padding:24px var(--gutter) 8px}
  .pin.page{max-width:var(--page);margin:0 auto;border-radius:var(--r-xl);box-shadow:var(--shadow);overflow:hidden}
  .pin.page.one{max-width:720px}
  .pin.page.one .pinmain,.pin.page.one .pinside{padding-left:28px;padding-right:28px}
  .pin.page.cols .pl{padding:16px 0 24px 16px}
  .pin.page.cols .pinvis{border-radius:var(--r-lg)}
  .pin.page.cols .pinvis .art,.pin.page.cols .pinvid{max-height:520px}
  .pin.page.cols .pinmain{padding:16px 24px 0}
  .pin.page.cols .pr > .pinsec{margin:0 24px}
}

/* EXPANSÃO NO FEED (mecanismo padrão): o cartão clicado se abre na largura toda da grade,
   o que estava acima fica no lugar e o restante segue abaixo, na grade normal. */
.gridwrap{display:flex;flex-direction:column;gap:var(--gap);container-type:inline-size}
.gridwrap.one{max-width:520px;margin:0 auto}
.xcard{border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;animation:xin .28s ease both}
@keyframes xin{from{opacity:.5;transform:scale(.985)}to{opacity:1;transform:none}}
.xcard .pinmain{padding:6px var(--gutter) 16px}
.xcard .pinside{padding:0 var(--gutter) 18px}
.xcard.cols .pinmain{padding:12px 20px 0}
.xcard .pintitle{font-size:clamp(22px,5.6vw,28px)}
@container (min-width:640px){ .xcard.one .pinmain,.xcard.one .pinside{padding-left:24px;padding-right:24px} }
/* folhas (bottom sheet no celular, diálogo a partir do tablet) */
.scrim{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet{display:flex;flex-direction:column;gap:14px;width:100%;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;
  padding:8px var(--gutter) calc(20px + var(--safe-b));border-radius:var(--r-lg) var(--r-lg) 0 0;background:var(--bg);animation:up .22s ease both}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
.grab{width:40px;height:5px;margin:4px auto 0;border-radius:9px;background:var(--line);flex:none}
.shead{display:flex;align-items:center;gap:8px}
.shead h2{flex:1;font-size:21px}
@media (min-width:768px){
  .scrim{align-items:center;padding:24px}
  .sheet{max-width:560px;max-height:85vh;max-height:85dvh;border-radius:var(--r-lg);padding:12px 24px 24px}
  .grab{display:none}
}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:var(--fs-sm);font-weight:500}
.field input,.field select,.field textarea{min-height:48px;padding:11px 12px;border:0;border-radius:var(--r-sm);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font-size:16px}
.field textarea{min-height:110px;resize:vertical}
.range{width:100%;min-height:32px;accent-color:var(--accent)}
.typegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.typebtn{display:flex;flex-direction:column;gap:4px;min-height:96px;padding:14px;border:0;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);text-align:left;color:var(--ink)}
.typebtn b{font-size:15px}
.typebtn small{font-size:12.5px;line-height:1.35;color:var(--muted)}
.msg{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.msg .av{width:42px;height:42px;border-radius:14px}
.msg .t{flex:1;min-width:0}
.msg b{display:block;font-size:14.5px}
.msg small{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.receipt{padding:12px;border-radius:var(--r-sm);background:var(--surface-2);text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:18px;letter-spacing:.08em}

/* aviso flutuante: sempre acima da barra inferior */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-space) + var(--safe-b) + 16px);z-index:70;transform:translateX(-50%);max-width:calc(100% - 2*var(--gutter));
  padding:12px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;box-shadow:var(--shadow)}
@media (min-width:768px){ .toast{bottom:24px;margin-left:48px} }
</style>

const STOPS = [[0,[192,54,44]],[45,[194,122,14]],[70,[110,154,58]],[85,[46,139,87]],[100,[15,107,62]]];
function tone(sc){ for(let k=1;k<STOPS.length;k++){ const [a,ca]=STOPS[k-1],[b,cb]=STOPS[k]; if(sc<=b){ const t=(sc-a)/(b-a); return "rgb("+ca.map((v,i)=>Math.round(v+(cb[i]-v)*t)).join(",")+")"; } } return "rgb(15,107,62)"; }
function sealOf(it){
  const sc = it.id in SEAL ? SEAL[it.id] : (String(it.uid).startsWith("c") ? null : 80);
  if (sc===null) return {sc:null, lv:"na", label:"Sem fatos a checar"};
  const lv = sc>=75 ? "ok" : sc>=45 ? "warn" : "bad";
  const label = sc>=90 ? "Alta confiança" : sc>=75 ? "Confiável" : sc>=45 ? "Confiança moderada" : "Baixa confiança";
  return {sc, lv, label, tone: tone(sc)};
}
const SEAL_PATH = "M12 2.2l2.3 1.7 2.8-.2.9 2.7 2.4 1.5-.6 2.8 1.2 2.6-2 2 .1 2.8-2.7.8-1.4 2.5-2.8-.5-2.3 1.6-2.3-1.6-2.8.5-1.4-2.5-2.7-.8.1-2.8-2-2 1.2-2.6-.6-2.8 2.4-1.5.9-2.7 2.8.2z";
function sealIco(s, z=18){
  if (s.lv==="na") return `<svg class="sealico" width="${z}" height="${z}" viewBox="0 0 24 24" aria-hidden="true"><path d="${SEAL_PATH}" fill="none" stroke="var(--muted)" stroke-width="1.6"/><path d="M8.5 12h7" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"/></svg>`;
  const glyph = s.lv==="bad" ? '<path d="M12 7.5v5.5M12 16.3v.01" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>' : '<path d="m8 12.3 2.8 2.8L16.3 9.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>';
  return `<svg class="sealico" width="${z}" height="${z}" viewBox="0 0 24 24" aria-hidden="true"><path d="${SEAL_PATH}" fill="${s.tone}"/>${glyph}</svg>`;
}
function sealChecks(it){
  const s = sealOf(it), o = ORG[it.org], note = SEAL_NOTE[it.id], verified = it.org!=="cidade-alerta";
  const L = (st, t, d) => `<div class="chk"><span class="st ${st}" aria-hidden="true">${{ok:"✓",warn:"!",bad:"✕",na:"–"}[st]}</span><span><b>${t}</b><small>${d}</small></span></div>`;
  let r = L(verified?"ok":"warn", "Organização verificada", verified ? `Identidade e coordenação de ${o.nome} conferidas.` : "Grupo sem responsáveis identificados.");
  if (s.lv==="na") r += L("na","Afirmações checadas","Este conteúdo é uma pergunta, um pedido ou uma opinião. O selo avalia fatos, não opiniões.");
  else if (note) r += L(s.lv, note[0], note[1]);
  else r += L("ok","Afirmações checadas","As afirmações conferem com fontes públicas.");
  if (it.tipo==="imagem" && !(note && note[0]==="Imagem original")) r += L("ok","Imagem original","Sem sinais de montagem ou de uso fora de contexto.");
  if (s.lv!=="na") r += L(s.sc>=75?"ok":s.sc>=45?"warn":"bad","Fontes citadas", s.sc>=75?"Links para documentos ou registros oficiais.": s.sc>=45?"Fontes parciais.":"Nenhuma fonte citada.");
  r += L(verified?"ok":"bad","Histórico da organização", verified ? "Publica correções quando erra." : "2 conteúdos com baixa confiança nos últimos 30 dias.");
  return r;
}
function sealBox(it){
  const s = sealOf(it);

function art(item, h=1, label){
  const [a,b] = PALETTES[item.id % PALETTES.length]; const H = Math.round(100*h); let g = "";
  if (item.art==="circles"){ for(let i=0;i<5;i++) g+=`<circle cx="${15+i*18}" cy="${H*(.3+.12*(i%3))}" r="${12+i*4}" fill="${i%2?a:"none"}" stroke="${a}" stroke-width="2.5" opacity="${.5+i*.1}"/>`; }
  else if (item.art==="grid"){ for(let x=0;x<6;x++) for(let y=0;y<Math.ceil(H/16);y++){ const on=(x*7+y*3+item.id)%5===0; g+=`<rect x="${4+x*16}" y="${4+y*16}" width="12" height="12" rx="3" fill="${on?a:"none"}" stroke="${a}" stroke-width="1.2" opacity="${on?1:.45}"/>`; } }
  else if (item.art==="arcs"){ for(let i=0;i<7;i++) g+=`<path d="M-10 ${H+10} A ${20+i*14} ${20+i*14} 0 0 1 ${30+i*28} ${H+10}" fill="none" stroke="${a}" stroke-width="${3+i%3}" opacity="${1-i*.1}"/>`; }
  else if (item.art==="stripes"){ for(let i=0;i<14;i++) g+=`<rect x="${i*8}" y="0" width="4" height="${H}" fill="${a}" opacity="${(i%4)/4+.2}" transform="skewX(-12)"/>`; }
  else g+=`<rect x="8" y="${H*.15}" width="40" height="${H*.5}" rx="6" fill="${a}"/><rect x="54" y="${H*.35}" width="38" height="${H*.5}" rx="6" fill="none" stroke="${a}" stroke-width="2.5"/><rect x="20" y="${H*.72}" width="22" height="${H*.18}" rx="4" fill="${a}" opacity=".5"/>`;
  const aria = label===false ? 'aria-hidden="true"' : `role="img" aria-label="Imagem ilustrativa: ${esc(item.titulo||"")}"`;
  return `<svg class="art" viewBox="0 0 100 ${H}" preserveAspectRatio="xMidYMid slice" ${aria}><rect width="100" height="${H}" fill="${b}"/>${g}</svg>`;
}

const cardFor = (it, mode, v) => v && v!=="masonry" && v!=="video" ? tabCard(it, mode, v) : card(it, mode);

function scrollToEl(el){ const t = $("#top"); const off = (t ? t.offsetHeight : 0) + 8;

class Grid {
  constructor(id, box, mode, n, v="masonry"){ this.id = id; this.mode = mode; this.n = n; this.v = v; this.items = []; this.obj = {}; this.A = null; this.sel = null; this.B = []; this.Bcols = null; this.empty = false; this.attach(box); }
  attach(box){ this.box = box; if (box){ box.dataset.grid = this.id; box.className = "gridwrap" + (this.n===1 ? " one" : "") + " v-" + this.v; } GRIDS[this.id] = this; }
  est(u){ const it = this.obj[u]; return EST_V[this.v] || EST[it.tipo](it); }
  add(it){ this.items.push(it.uid); this.obj[it.uid] = it; this.B.push(it.uid); if (this.Bcols) this.placeB(it.uid); }
  cols(){ const m = document.createElement("div"); m.className = "masonry" + (this.n===1 ? " one" : "") + " v-" + this.v; const cs = [];
    for (let i=0;i<this.n;i++){ const c = document.createElement("div"); c.className = "col"; m.appendChild(c); cs.push(c); } return [m, cs]; }
  placeB(u){ const i = this.Bh.indexOf(Math.min(...this.Bh)); this.Bcols[i].insertAdjacentHTML("beforeend", cardFor(this.obj[u], this.mode, this.v)); fitTiles(this.Bcols[i].lastElementChild); this.Bh[i] += this.est(u); }

    const box = this.box; if (!box) return; box.innerHTML = "";
    if (!this.items.length && this.empty){ box.innerHTML = `<p class="empty">Nada por aqui ainda.</p>`; this.Bcols = null; return; }
    if (this.sel && this.A && this.A.some(c=>c.length)){ const [m, cs] = this.cols(); this.A.forEach((col,j)=>col.forEach(u=>cs[j].insertAdjacentHTML("beforeend", cardFor(this.obj[u], this.mode, this.v)))); box.appendChild(m); }

      const xv = x.querySelector("video"); xv && xv.addEventListener("loadedmetadata", ()=>layoutPin(x), {once:true}); }

}

function playX(x, uid){ const v = x && x.querySelector("video.pinvid"); const st = S.vid[uid]; if (!v || !st) return;

/* =====================================================================
   8. Motor do feed (rolagem contínua com pausas)
   ===================================================================== */
const PAUSE_EVERY = 18;
const F = {items:[], cursor:0, paused:false, ended:false, key:"", grid:null, obs:null};
const tabTypes = () => (FTABS.find(t=>t[0]===S.tab)||FTABS[0])[2];
const feedMode = () => S.algo ? "algo" : "amplo";
const feedKey = () => [S.algo, S.tab, S.usarOrgs, S.temas.join(","), S.created.length, [...S.follow].join(","), JSON.stringify(S.filt), S.ord].join("|");
const scoreAlgo = it => ((S.follow.has(it.org)&&S.usarOrgs)?1:0)*(S.mix/100) + (S.temas.includes(it.tema)?1:0)*(1-S.mix/100) - it.min/20000;
/* algoritmo desligado: critérios amplos e iguais para todos (rodízio de temas e cidades, mais novo primeiro) */
function amplo(list){
  const by = {}; list.slice().sort((a,b)=>a.min-b.min).forEach(it=>{ (by[it.tema]=by[it.tema]||[]).push(it); });
  const keys = Object.keys(by).sort((a,b)=>by[a][0].min-by[b][0].min); const out = []; let last = null;
  while (out.length < list.length){ for (const k of keys){ const q = by[k]; if(!q.length) continue;
    let i = q.findIndex(it=>ORG[it.org].cidade!==last); if(i<0) i=0; const it = q.splice(i,1)[0]; out.push(it); last = ORG[it.org].cidade; } }
  return out;
}
const ofTab = types => it => !types || types.includes(it.tipo);
const inProfile = it => (S.follow.has(it.org)&&S.usarOrgs) || S.temas.includes(it.tema);
/* filtros e ordenação: valem só para a navegação atual, não mudam o algoritmo */
const CIDADES = [...new Set(ORGS.map(o=>o.cidade))];
const ORDS = [["padrao","Padrão"],["recentes","Mais recentes"],["confiaveis","Mais confiáveis"],["participacao","Mais participação"]];
const nFiltros = (fl=S.filt) => fl.temas.length + fl.cidades.length + (fl.minhas?1:0) + (fl.conf?1:0);
function passa(it, fl=S.filt){
  if (fl.temas.length && !fl.temas.includes(it.tema)) return false;
  if (fl.cidades.length && !fl.cidades.includes(ORG[it.org].cidade)) return false;
  if (fl.minhas && !S.follow.has(it.org)) return false;
  if (fl.conf){ const sc = sealOf(withUid(it)).sc; if (sc!==null && sc < fl.conf) return false; }
  return true;
}
const participacao = it => it.tipo==="enquete" ? it.votos.reduce((a,b)=>a+b,0) : it.tipo==="votacao" ? it.votaram : it.tipo==="evento" ? it.vao : it.tipo==="chamado" ? it.tem : 0;
function ordena(l){
  if (S.ord==="recentes") return l.slice().sort((a,b)=>a.min-b.min);
  if (S.ord==="confiaveis") return l.slice().sort((a,b)=>(sealOf(withUid(b)).sc ?? -1) - (sealOf(withUid(a)).sc ?? -1));
  if (S.ord==="participacao") return l.slice().sort((a,b)=>participacao(b)-participacao(a));
  return l;
}
function source(fl=S.filt, types=tabTypes()){
  const l = source0(fl, types);
  /* Eventos e chamados é uma agenda: no padrão, o que acontece ou vence primeiro */
  return S.tab==="agenda" && S.ord==="padrao" && types===tabTypes() ? l.slice().sort((a,b)=>(+a.dia || a.ate || 99) - (+b.dia || b.ate || 99)) : l;
}
function source0(fl, types){
  const t = ofTab(types), f = it => t(it) && passa(it, fl);
  if (!S.algo) return ordena(amplo(POOL.filter(f)));
  const l = POOL.filter(it=>f(it) && inProfile(it)).sort((a,b)=>scoreAlgo(b)-scoreAlgo(a));
  return ordena(l.length >= 4 ? l : l.concat(POOL.filter(it=>f(it) && !inProfile(it))));
}
const tabLayout = () => (FTABS.find(t=>t[0]===S.tab)||FTABS[0])[3];
function wrapClass(){ const fw = $("#feedwrap"); if (fw) fw.className = tabLayout()==="blocos" ? "rwrap" : "lwrap"; }
function layoutFeed(){ if (!F.grid) return; wrapClass(); F.grid.attach($("#feed")); F.grid.render(); fitTiles(); }
function more(n=10){
  if (F.paused || F.ended) return;
  const src = source(); if (!src.length){ F.ended = true; renderStop(); return; }
  for (let k=0;k<n;k++){
    if ((S.tab!=="tudo" || nFiltros()) && F.cursor>=src.length){ F.ended = true; break; }
    const base = src[F.cursor % src.length], round = Math.floor(F.cursor/src.length);
    const it = Object.assign(withUid(base, round), {min: base.min + round*2880});
    F.items.push(it); F.grid.add(it); F.cursor++;
    if (S.pausas && F.cursor % PAUSE_EVERY===0){ F.paused = true; break; }
  }

}
/* se a tela ainda não encheu (sentinela visível), carrega mais sem esperar a rolagem */
function fillViewport(){ const st = $("#sentinel"); if (!st || F.paused || F.ended || route()!=="inicio") return;
  if (st.getBoundingClientRect().top < innerHeight + 800) more(10); }
function resetFeed(){

  F.grid = L==="blocos" ? new TileGrid("feed", $("#feed"), feedMode()) : new Grid("feed", $("#feed"), feedMode(), 1, L);
  const types = tabTypes(); S.created.slice().reverse().forEach(c=>{ if(!types || types.includes(c.tipo)){ F.items.push(c); F.grid.add(c); } });
  F.grid.render(); more(12);
}
/* avisos do feed: discretos, centralizados, sem bloco pesado */
function renderStop(){

  const all = S.tab!=="tudo" ? `<button class="linkbtn" type="button" data-act="ftab" data-tab="tudo">Ver tudo</button>` : "";
  if (F.ended && F.cursor>0) box.innerHTML = note(`<b>Você viu tudo${S.tab!=="tudo"?" em "+nome:""}.</b> ${nf?"Com os filtros atuais, não há mais conteúdo.":"Quando suas organizações publicarem mais, aparece aqui."}`, all + clear);

  else box.innerHTML = `<div class="loading">Carregando mais…</div>`;

function statusLine(){
  const n = nFiltros(), o = ORDS.find(x=>x[0]===S.ord)[1];
  const txt = S.algo ? `<b>Ligado:</b> ${S.temas.length} temas${S.usarOrgs?" + suas organizações":""}` : `<b>Desligado:</b> conteúdo amplo, sem usar seu perfil`;

/* =====================================================================
   Grade do Início (referência Instagram): blocos de 3 colunas × 2 linhas,
   cada cartão com o tamanho do seu tipo. Ver a regra no CSS ("GRADE DO INÍCIO").
   ===================================================================== */
/* Monta o próximo bloco a partir da fila. Olha até LOOK itens à frente para completar
   o bloco sem deixar buraco; a ordem do feed muda no máximo LOOK posições.
   Formas: [texto 2×2 | coluna de mídia] (lados alternados), [texto | texto] em dupla,
   [3 colunas de mídia]; coluna de mídia = 1 vídeo vertical ou 2 imagens (1 imagem sozinha fica vertical).
   No fim da lista (final), sobra uma linha parcial, como no Instagram. */
const LOOK = 5;
function planBlock(Q, final, g){
  if (!Q.length || (!final && Q.length <= LOOK)) return null;
  const take = pred => { const n = Math.min(Q.length, LOOK+1); for (let i=0;i<n;i++) if (pred(Q[i])) return Q.splice(i,1)[0]; return null; };
  const cell = (it, size, r, c, rs, cs) => ({uid:it.uid, size, area:[r,c,rs,cs]});
  const mediaCol = c => { const m = take(it=>!isTextual(it)); if (!m) return null;
    if (m.tipo==="video") return [cell(m,"t",1,c,2,2)];
    const m2 = take(it=>it.tipo==="imagem");
    return m2 ? [cell(m,"s",1,c,1,2), cell(m2,"s",2,c,1,2)] : [cell(m,"t",1,c,2,2)]; };
  if (isTextual(Q[0])){
    const tx = Q.shift(), right = g.side; const col = mediaCol(right ? 1 : 5);
    if (col){ g.side = !g.side; return {cells:[cell(tx,"w",1,right?3:1,2,4)].concat(col)}; }
    const t2 = take(isTextual);
    if (t2) return {cells:[cell(tx,"h",1,1,2,3), cell(t2,"h",1,4,2,3)]};
    return {cells:[cell(tx,"h",1,1,2,3)]};
  }
  const cells = mediaCol(1); const tx = take(isTextual);
  if (tx){ cells.push(cell(tx,"w",1,3,2,4)); return {cells}; }
  for (const c of [3,5]){ const col = mediaCol(c); if (!col) break; cells.push(...col); }
  if (cells.some(x=>x.area[1]===5)) return {cells};
  /* fim da lista com menos de 3 colunas: vira uma linha de quadrados */
  const its = cells.map(x=>x.uid); Q.unshift(...its.map(u=>g.obj[u]));
  const row = []; for (let c=1; c<=5 && Q.length && !isTextual(Q[0]); c+=2) row.push(cell(Q.shift(),"s",1,c,1,2));
  return {row1:true, cells:row};
}

/* a leitura do cartão textual ocupa todo o espaço livre, em linhas inteiras (no mínimo 5) */
function fitTiles(root){ const ps = [...(root||document).querySelectorAll(".tbody > p")];
  ps.forEach(p=>p.style.setProperty("--cl", 99));                       /* 1. solta o texto */
  const n = ps.map(p=>{ const lh = parseFloat(getComputedStyle(p).lineHeight) || 18; return Math.max(1, Math.floor((p.parentNode.clientHeight + 1) / lh)); }); /* 2. mede o espaço */
  ps.forEach((p,i)=>p.style.setProperty("--cl", n[i]));                 /* 3. corta em linhas inteiras */
  const cx = [...(root||document).querySelectorAll(".capx")];             /* legendas: resumo = total − linhas do título */
  const tl = cx.map(c=>{ const t = c.firstElementChild, lh = parseFloat(getComputedStyle(t).lineHeight) || 18; return Math.max(1, Math.round(t.getBoundingClientRect().height / lh)); });
  cx.forEach((c,i)=>c.style.setProperty("--sl", Math.max(1, (+c.dataset.n) - tl[i]))); }

class TileGrid {
  constructor(id, box, mode){ this.id = id; this.mode = mode; this.items = []; this.obj = {}; this.Q = []; this.blocks = []; this.side = false; this.sel = null; this.rendered = false; this.attach(box); }
  attach(box){ this.box = box; if (box){ box.dataset.grid = this.id; box.className = "rgrid"; } GRIDS[this.id] = this; }
  add(it){ this.items.push(it.uid); this.obj[it.uid] = it; this.Q.push(it); }
  blockHTML(b){ return `<div class="blk${b.row1?" row1":""}">${b.cells.map(c=>tileHTML(this.obj[c.uid], c, this.mode)).join("")}</div>`; }
  /* monta os blocos completos; com final=true (pausa ou fim), monta também o que sobrou */
  flush(final){ const out = []; let b; while ((b = planBlock(this.Q, final, this))){ if (!b.cells.length) break; this.blocks.push(b); out.push(b); }
    if (this.rendered && this.box && out.length){ this.box.insertAdjacentHTML("beforeend", out.map(x=>this.blockHTML(x)).join("")); fitTiles(this.box); } }
  render(){ if (!this.box) return; this.box.innerHTML = this.blocks.map(b=>this.blockHTML(b)).join(""); this.rendered = true; fitTiles(this.box);
    if (this.sel) tileOpen(this.box, this, this.sel, false); }
  select(uid){ if (this.sel===uid && this.box.querySelector(".xcard")){ this.close(); return true; } const ok = tileOpen(this.box, this, uid); if (ok) this.sel = uid; return ok; }
  close(){ const x = this.box.querySelector(":scope > .xcard"); x && x.remove(); const u = this.sel; this.sel = null;
    const t = u && this.box.querySelector(`[data-tile="${u}"]`); if (t){ scrollToEl(t); const b = t.querySelector(".tbtn"); b && b.focus({preventScroll:true}); } }
}

/* Equilíbrio do cartão aberto: 2 colunas quando o cartão tem largura (≥640px).
   Seções vão para a coluna mais curta; se a leitura ainda passar da coluna da esquerda,
   o texto termina no fim do box com "Mostrar mais". Nenhum cartão abre com espaço vazio. */
function layoutPin(pin){
  if (!pin || !pin.isConnected) return;
  const pl = pin.querySelector(".pl"), pr = pin.querySelector(".pr"), side = pin.querySelector(".pinside");
  const secs = [...pin.querySelectorAll(".pinsec.s")], t = pin.querySelector(".pintext"), mb = pin.querySelector(".moretext");
  secs.forEach(x=>side.appendChild(x));
  t.style.maxHeight = ""; t.classList.remove("clamped"); mb.hidden = true;
  const cols = pin.classList.contains("two") && !!pl && pin.clientWidth >= 640;
  pin.classList.toggle("cols", cols);
  const art = pin.querySelector(".pinvis .art"); if (art){ art.style.height = ""; art.style.maxHeight = ""; art.style.aspectRatio = ""; }
  const vid = pin.querySelector(".pinvis video"); pin.style.gridTemplateColumns = ""; if (vid) vid.style.maxHeight = "";
  if (cols){
    t.style.maxHeight = "none";
    /* 1. testa todas as combinações de seções nas duas colunas e fica com a mais equilibrada */
    let best = null; const art0 = art ? art.getBoundingClientRect().height : 0;
    for (let m=0; m < (1<<secs.length); m++){
      secs.forEach((x,i)=> (m>>i & 1 ? pr : pl).appendChild(x));
      const diff = pr.offsetHeight - pl.offsetHeight; let d;
      if (art){ const need = art0 + diff; d = need < 260 ? 1000 + (260-need)*3 : need > 620 ? (need-620) : Math.abs(need-art0)*0.3; }
      else d = Math.abs(diff);
      if (!best || d < best.d) best = {m, d};
    }
    secs.forEach((x,i)=> (best.m>>i & 1 ? pr : pl).appendChild(x));
    /* 2. imagem ajusta a altura (dentro de limites) para fechar a diferença */
    if (art){ const diff = pr.offsetHeight - pl.offsetHeight;
      if (Math.abs(diff) > 6){ const h = Math.min(640, Math.max(260, art.getBoundingClientRect().height + diff));
        art.style.aspectRatio = "auto"; art.style.maxHeight = "none"; art.style.height = h + "px"; } }
    /* 2b. vídeo não pode ser cortado: a coluna da esquerda estreita ou alarga até as alturas baterem */
    if (vid){ vid.style.maxHeight = "none"; const W = pin.clientWidth;
      const pick = () => { let bb = null; for (let m=0; m < (1<<secs.length); m++){ secs.forEach((x,i)=> (m>>i & 1 ? pr : pl).appendChild(x));
        const d = Math.abs(pl.offsetHeight - pr.offsetHeight); if (!bb || d < bb.d) bb = {m, d}; } secs.forEach((x,i)=> (bb.m>>i & 1 ? pr : pl).appendChild(x)); };
      for (let k=0;k<6;k++){ if (k===3) pick(); const diff = pl.offsetHeight - pr.offsetHeight; if (Math.abs(diff) < 8) break;
        const r = vid.getBoundingClientRect(); const nh = Math.min(620, Math.max(180, r.height - diff));
        const lw = Math.min(W*0.66, Math.max(W*0.22, r.width * nh / r.height)) + 16;
        pin.style.gridTemplateColumns = `${Math.round(lw)}px minmax(0,1fr)`; } }
    /* 3. se a leitura ainda passar do box, o texto termina no fim com "Mostrar mais" */
    if (!t.classList.contains("open")){
      const diff = pr.offsetHeight - pl.offsetHeight;
      if (diff > 24) t.style.maxHeight = Math.max(120, t.offsetHeight - diff - 44) + "px";
    }
    /* 4. depois de cortar o texto, o vídeo reequilibra mais uma vez */
    if (vid){ vid.style.maxHeight = "none"; const W = pin.clientWidth;
      const pick = () => { let bb = null; for (let m=0; m < (1<<secs.length); m++){ secs.forEach((x,i)=> (m>>i & 1 ? pr : pl).appendChild(x));
        const d = Math.abs(pl.offsetHeight - pr.offsetHeight); if (!bb || d < bb.d) bb = {m, d}; } secs.forEach((x,i)=> (bb.m>>i & 1 ? pr : pl).appendChild(x)); };
      for (let k=0;k<6;k++){ if (k===3) pick(); const diff = pl.offsetHeight - pr.offsetHeight; if (Math.abs(diff) < 8) break;
        const r = vid.getBoundingClientRect(); const nh = Math.min(620, Math.max(180, r.height - diff));
        const lw = Math.min(W*0.66, Math.max(W*0.22, r.width * nh / r.height)) + 16;
        pin.style.gridTemplateColumns = `${Math.round(lw)}px minmax(0,1fr)`; } }
  }
  if (t.scrollHeight > t.clientHeight + 4){ t.classList.add("clamped"); mb.hidden = false; }
  else if (t.classList.contains("open") && bodyOf(findItem(pin.dataset.uid)||{}).join(" ").length > 420) mb.hidden = false;
}

    S.support["c"+n] = true; closeSheet(); S.orgTab = "votacoes"; render(); toast("Proposta aberta. Seu apoio já conta."); },
  contest: () => toast("Contestação recebida: nova verificação automática, com registro público."),
  follow: b => { const id = b.dataset.org; S.follow.has(id) ? S.follow.delete(id) : S.follow.add(id); persist("follow");
    const r = route(), x = b.closest(".xcard");
    if (x) refresh(x.dataset.x); else if (r.startsWith("pin-")) refresh(r.slice(4)); else { const y = window.scrollY; render(); window.scrollTo(0,y); }
    toast(S.follow.has(id) ? "Agora você participa." : "Você saiu da organização."); },
  otab: b => { S.orgTab = b.dataset.tab; $$('[data-act="otab"]').forEach(t=>t.setAttribute("aria-selected", t.dataset.tab===S.orgTab)); $("#orgbody").innerHTML = orgTabBody(ORG[route().slice(4)]); fillOrg(); },
  etema: b => { S.exploreTema = S.exploreTema===b.dataset.t ? null : b.dataset.t; $$('[data-act="etema"]').forEach(c=>c.setAttribute("aria-pressed", c.dataset.t===S.exploreTema)); fillExplore(); },
  publish: b => { const tit = $("#ctit").value.trim(); if (!tit){ toast("Dê um título à publicação."); $("#ctit").focus(); return; }
    const k = b.dataset.k, n = S.created.length;
    if (k==="votacao"){ const o = ORG[$("#corg").value], vt = Math.round(o.membros*.66);
      S.created.push({id:900+n, uid:"c"+n, tipo:"votacao", fase:"apoios", org:o.id, tema:$("#ctema").value, min:0, titulo:tit, texto:$("#ctxt").value.trim() || "Proposta aberta para apoios.", quorum:Math.ceil(vt/2), votantes:vt, votaram:0, apoios:0, prazo:"—", opcoes:["Aprovar a proposta","Rejeitar","Abster-se"], critico:false, autor:"você"});
      S.support["c"+n] = true; }
    else S.created.push({id:900+n, uid:"c"+n, tipo:"texto", org:$("#corg").value, tema:$("#ctema").value, min:0, titulo:tit, texto:$("#ctxt").value.trim() || ({evento:"Evento criado agora. Detalhes em breve.",enquete:"Enquete criada agora.",votacao:"Aviso de votação formal.",chamado:"Chamado criado agora.",documento:"Documento anexado."}[k]||"")});
    if (S.tab!=="tudo" && S.tab!=="publicacoes"){ S.tab = "tudo"; persist("tab"); }
    closeSheet(); if (route()==="perfil"){ S.profTab = "publicacoes"; S.profFolder = null; render(); } else go("inicio"); toast("Publicado no mural da organização."); },
  tema: b => { S.tema = b.dataset.v; persist("tema"); applyTheme(); $$('[data-act="tema"]').forEach(x=>x.setAttribute("aria-checked", x.dataset.v===S.tema)); },
  ptab: b => { S.profTab = b.dataset.tab; S.profFolder = null; profShow(); },
  openfolder: b => { S.profFolder = b.dataset.f || null; S.profTab = "salvos"; if (route()!=="perfil"){ go("perfil"); return; } profShow(); window.scrollTo(0,0); },
  setting: b => { const k = b.dataset.k; S[k] = !S[k]; persist(k); b.setAttribute("aria-checked", S[k]);
    if (k==="publico"){ const y = window.scrollY; render(); window.scrollTo(0,y); toast(S.publico ? "Seu perfil agora é público." : "Seu perfil agora é privado."); return; }
    if (k==="algo"){ const s = b.closest(".setting").querySelector("small"); s.textContent = (S.algo?"Ligado":"Desligado") + ". A sua escolha fica salva: nada volta sozinho para o algoritmo."; } }
};
document.addEventListener("click", e=>{
  const nav = e.target.closest("[data-nav-to]"); if (nav){ closeSheet(); go(nav.dataset.navTo); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const fn = A[b.dataset.act]; if (fn) fn(b, e);
});
document.addEventListener("input", e=>{
  if (e.target.id==="q"){ S.exploreQ = e.target.value; fillExplore(); }
  if (e.target.id==="mix"){ S.mix = +e.target.value; $("#mixv").textContent = `${S.mix}% organizações · ${100-S.mix}% temas`; }
});
document.addEventListener("keydown", e=>{ if (e.key==="Escape" && $("#layer .scrim")) closeSheet(); });
window.addEventListener("hashchange", render);
window.addEventListener("scroll", ()=>{ const t = $("#top"); if (t) t.classList.toggle("scrolled", window.scrollY > 4); }, {passive:true});
window.addEventListener("resize", debounce(()=>{ layoutAllPins(); fitTiles(); }, 150));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ layoutAllPins(); fitTiles(); });

/* PARTICIPAÇÃO AO VIVO (Estrutura #3): a cada poucos segundos entra um voto, apoio, presença ou voluntário
   num conteúdo visível. No produto real, isso vem do servidor em tempo real; aqui é simulado. */
const LIVE_T = ["enquete","votacao","chamado","evento"];
setInterval(()=>{ if (document.hidden || $("#layer .scrim")) return;
  const els = $$('#main [data-tile], #main article[data-card]').filter(e=>{ const r = e.getBoundingClientRect(); return r.bottom > 0 && r.top < innerHeight; });
  const uids = [...new Set(els.map(e=>e.dataset.tile || e.dataset.card))];
  const its = uids.map(u=>findItem(u)).filter(it=>it && LIVE_T.includes(it.tipo) && !String(it.uid).startsWith("c"));
  if (!its.length) return;
  const it = its[Math.floor(Math.random()*its.length)], L = LIVE[it.id] = LIVE[it.id] || {n:0, v:[]};
  if (it.tipo==="enquete"){ const i = Math.floor(Math.random()*it.opcoes.length); L.v[i] = (L.v[i]||0) + 1; } else L.n++;
  uids.filter(u=>{ const x = findItem(u); return x && x.id===it.id; }).forEach(u=>refresh(u, true));
}, 3500);
const VERSAO = "07/11 19:46";
console.info("a rede.com · protótipo · versão " + VERSAO);
render();
})();
</script>
</body>
</html>
